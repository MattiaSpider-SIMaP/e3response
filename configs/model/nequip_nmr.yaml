_target_: tensorial.ReaxModule

metrics:
    nmr_tensors_rmse:
      _target_: tensorial.gcnn.graph_metric
      metric: rmse
      predictions: nodes.predicted_nmr_tensors
      targets: nodes.nmr_tensors
      mask: nodes.nmr_active

# optimizer:
#   _target_: optax.adam
#   # learning_rate: 0.01
#   learning_rate:
#       _target_: optax.exponential_decay
#       init_value: 0.05
#       transition_steps: 500
#       decay_rate: 0.9

optimizer:
  _target_: optax.chain
  _args_:
    - _target_: optax.contrib.reduce_on_plateau
      factor: 0.9                      
      patience: 20
      rtol: 0.0001         
      atol: 0.001         
      cooldown: 5        
      min_scale: 1.0e-6
    - _target_: optax.adam
      learning_rate: 0.1 

# optimizer:
#   _target_: optax.chain
#   _args_:
#     - _target_: optax.contrib.reduce_on_plateau
#       factor: 0.8                    
#       patience: 50                  
#       rtol: 0.001                    
#       atol: 0.01                     
#       cooldown: 5                    
#       accumulation_size: 4           
#       min_scale: 1.0e-5
#     - _target_: optax.adam
#       learning_rate: 0.01 

loss_fn:
  _target_: e3response.losses.response_loss
  nmr_tensors: true

model:
  _target_: tensorial.nn.Sequential
  layers:
    # ---- backbone: task-agnostic hidden features ----
    # These four knobs are the Optuna search space.  Keep lmax >= 2: the NMR head below emits
    # 1x2e, which is unlearnable without l=2 features.
    - _target_: tensorial.gcnn.build_nequip_backbone
      num_layers: 3
      mul: 8
      lmax: 2
      r_max: ${r_max}
      n_elements: ${from_data.n_elements}
      avg_num_neighbours: ${from_data.avg_num_neighbours}
      atomic_numbers: ${from_data.atomic_numbers}
      sh_irreps: 0e + 1o + 2e

    # ---- readout: NMR specific, stays declarative here ----
    # Reduce the number passing this point
    - _target_: tensorial.gcnn.NodewiseLinear
      irreps_out: 4x0e + 4x0o + 4x1e + 4x1o + 4x2e + 4x2o #+ 2x3o + 2x3e

    # Per atom NMR tensors
    - _target_: tensorial.gcnn.NodewiseLinear
      irreps_out: 1x0e + 1x1e + 1x2e
      out_field: predicted_nmr_tensors

    - _target_: tensorial.gcnn.NodewiseDecoding
      in_field: predicted_nmr_tensors
      attrs:
        predicted_nmr_tensors:
          _target_: tensorial.CartesianTensor
          formula: ij
          i: 1e
          j: 1e
