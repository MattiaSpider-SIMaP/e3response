# @package _global_

# Optuna search over the NequIP backbone knobs.
#
#   e3response train -i configs/train.yaml -m experiment=sweep debug=toy \
#       data=qm9_nmr model=nequip_nmr
#
# `-i` is needed because the CLI defaults to examples/train.yaml, not this configs/ tree.
#
# The four knobs live on the backbone builder, which is entry 0 of the model's `layers` list,
# hence the `model.model.layers.0.` prefix (the model group file itself nests a `model:` key).

defaults:
  - override /hydra/sweeper: optuna

# Metric returned by `main()` and minimised by the sweeper
optimized_metric: "val/nmr_tensors_rmse"

hydra:
  sweeper:
    direction: minimize
    study_name: nequip_nmr
    storage: null
    n_trials: 4
    n_jobs: 1
    sampler:
      _target_: optuna.samplers.TPESampler
      # TPE draws its first `n_startup_trials` (10 by default) at random, so with only 4 trials
      # over a 16-point grid some seeds repeat a combination.  Seed 8 gives 4 distinct draws that
      # exercise all four knobs; raise `n_trials` for a real search and the seed stops mattering.
      seed: 8
    params:
      r_max: choice(4.0, 5.0)
      model.model.layers.0.num_layers: choice(2, 3)
      model.model.layers.0.mul: choice(8, 16)
      # Never go below 2: the NMR head emits 1x2e, so without l=2 features the anisotropic
      # component of the tensor is unlearnable
      model.model.layers.0.lmax: choice(2, 3)
